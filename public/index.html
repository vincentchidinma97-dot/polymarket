<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Polymarket Insider Tracker</title>
<style>
  :root {
    --bg: #0f1115; --surface: #171a21; --surface2: #1e222b;
    --border: #2a2f3a; --ink: #e8eaf0; --ink2: #9aa3b2; --ink3: #6b7382;
    --good: #4ade80; --bad: #f87171; --accent: #818cf8; --warn: #fbbf24;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.5 -apple-system, "SF Pro Text", Segoe UI, sans-serif; padding: 16px; }
  h1 { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
  .sub { color: var(--ink3); font-size: 12px; margin-bottom: 16px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
  .tabs button, .controls select, .controls button {
    background: var(--surface); color: var(--ink2); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 14px; font-size: 13px; cursor: pointer;
  }
  .tabs button.active { color: var(--ink); border-color: var(--accent); background: var(--surface2); }
  .controls { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
  .controls label { color: var(--ink3); font-size: 12px; }
  .controls button.on { border-color: var(--good); color: var(--ink); }
  table { width: 100%; min-width: 580px; border-collapse: collapse; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  th { text-align: left; color: var(--ink3); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; font-weight: 500; padding: 10px 12px; border-bottom: 1px solid var(--border); }
  td { padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  tbody tr.click { cursor: pointer; }
  tbody tr.click:hover { background: var(--surface2); }
  .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  th.num { text-align: right; }
  .good { color: var(--good); } .bad { color: var(--bad); }
  .muted { color: var(--ink3); font-size: 12px; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .pill.buy { background: rgba(74,222,128,.12); color: var(--good); }
  .pill.sell { background: rgba(248,113,113,.12); color: var(--bad); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 14px 0; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .tile .k { color: var(--ink3); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
  .tile .v { font-size: 20px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .back { color: var(--accent); cursor: pointer; font-size: 13px; margin-bottom: 10px; display: inline-block; background: none; border: none; padding: 0; }
  a { color: var(--accent); text-decoration: none; }
  h2 { font-size: 14px; font-weight: 600; margin: 18px 0 8px; }
  .status { color: var(--ink3); font-size: 12px; padding: 20px; text-align: center; }
  .traderlink { color: var(--ink); cursor: pointer; }
  .traderlink:hover { color: var(--accent); }
  .wrap { max-width: 1100px; margin: 0 auto; }
  .badge { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; margin-left: 6px; }
  .badge.new { background: rgba(129,140,248,.15); color: var(--accent); }
  .badge.hot { background: rgba(251,191,36,.15); color: #fbbf24; }
  .badge.watching { background: rgba(74,222,128,.15); color: var(--good); }
  .scroll { overflow-x: auto; }
  .watch-btn {
    background: none; border: 1px solid var(--border); color: var(--ink3); border-radius: 6px;
    padding: 2px 8px; font-size: 11px; cursor: pointer; white-space: nowrap;
  }
  .watch-btn:hover { border-color: var(--accent); color: var(--ink); }
  .watch-btn.active { border-color: var(--good); color: var(--good); }
  .live-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--good); margin-right: 6px; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 10px; cursor: pointer; }
  .card:hover { border-color: var(--accent); }
  .card-head { display: flex; justify-content: space-between; align-items: start; flex-wrap: wrap; gap: 6px; }
  .alert { background: rgba(251,191,36,.08); border: 1px solid rgba(251,191,36,.3); border-radius: 8px; padding: 10px 14px; margin-bottom: 10px; font-size: 13px; }
  .alert strong { color: var(--warn); }
  .signal-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 12px; }
  .signal-card.high { border-left: 3px solid var(--good); }
  .signal-card.med { border-left: 3px solid var(--warn); }
  .signal-card.low { border-left: 3px solid var(--ink3); }
  .signal-strength { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; padding: 2px 8px; border-radius: 4px; }
  .signal-strength.high { background: rgba(74,222,128,.12); color: var(--good); }
  .signal-strength.med { background: rgba(251,191,36,.12); color: var(--warn); }
  .signal-strength.low { background: rgba(107,115,130,.15); color: var(--ink3); }
  .trader-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .trader-chip { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 2px 8px; font-size: 11px; cursor: pointer; }
  .trader-chip:hover { border-color: var(--accent); color: var(--accent); }
  .copyable-tag { font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: 4px; }
  .copyable-tag.yes { background: rgba(74,222,128,.12); color: var(--good); }
  .copyable-tag.late { background: rgba(248,113,113,.12); color: var(--bad); }
  .section-header { display: flex; align-items: center; gap: 8px; margin: 20px 0 10px; }
  .section-header h2 { margin: 0; }
  .section-count { background: var(--surface2); color: var(--ink2); font-size: 11px; padding: 2px 8px; border-radius: 999px; }
  .port-bar { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; margin-bottom: 14px; }
  .port-bar .big { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .port-bar .label { color: var(--ink3); font-size: 12px; }
  .retro-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 14px; }
  .retro-card h3 { font-size: 13px; font-weight: 600; margin-bottom: 8px; }
  .toggle-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .toggle-label { color: var(--ink2); font-size: 13px; }
  .toggle { position: relative; width: 40px; height: 22px; background: var(--border); border-radius: 11px; cursor: pointer; transition: background .2s; }
  .toggle.on { background: var(--good); }
  .toggle::after { content:''; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; background: var(--ink); border-radius: 50%; transition: transform .2s; }
  .toggle.on::after { transform: translateX(18px); }
  .news-item { display: flex; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 12px; }
  .news-item:last-child { border-bottom: none; }
  .news-item .news-src { color: var(--accent); font-weight: 600; white-space: nowrap; min-width: 80px; }
  .news-item .news-title { color: var(--ink); flex: 1; }
  .news-item .news-title a { color: var(--ink); text-decoration: none; }
  .news-item .news-title a:hover { color: var(--accent); }
  .news-item .news-time { color: var(--ink3); white-space: nowrap; }
  .sentiment-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
  .sentiment-dot.bullish { background: var(--good); }
  .sentiment-dot.bearish { background: var(--bad); }
  .sentiment-dot.neutral { background: var(--ink3); }
  .news-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 10px; }
  .news-card .news-market { font-weight: 600; font-size: 13px; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Polymarket Insider Tracker</h1>
  <div class="sub">Track profitable new wallets, watch their moves, and study betting patterns. Research tool only; not financial advice.</div>

  <div class="tabs">
    <button id="tab-signals" class="active" onclick="showTab('signals')">Signals</button>
    <button id="tab-watchlist" onclick="showTab('watchlist')">Watchlist</button>
    <button id="tab-new" onclick="showTab('new')">New Winners</button>
    <button id="tab-lb" onclick="showTab('lb')">Leaderboard</button>
    <button id="tab-whale" onclick="showTab('whale')">Whale Feed</button>
    <button id="tab-paper" onclick="showTab('paper')">Paper Trading</button>
  </div>

  <div id="view-signals">
    <div class="controls">
      <span class="live-dot"></span>
      <label>Smart money consensus + copyable entries from top 50 traders</label>
      <button onclick="loadSignals()">Refresh</button>
    </div>
    <div id="signals-body" class="scroll"><div class="status">Loading signals — scanning top traders' positions…</div></div>
  </div>

  <div id="view-watchlist" style="display:none">
    <div class="controls">
      <span class="live-dot"></span>
      <label id="watchlist-status">Auto-refreshing every 60s</label>
      <button onclick="loadWatchlist()">Refresh now</button>
      <button id="export-btn" onclick="exportWatchlist()">Export list</button>
      <button id="import-btn" onclick="document.getElementById('import-file').click()">Import list</button>
      <input type="file" id="import-file" accept=".json" style="display:none" onchange="importWatchlist(event)">
    </div>
    <div id="watchlist-body" class="scroll"><div class="status">Loading watchlist…</div></div>
  </div>

  <div id="view-new" style="display:none">
    <div class="controls">
      <label>7-day winners with &lt;100 lifetime positions — new or fresh accounts worth watching.</label>
    </div>
    <div id="new-body" class="scroll"><div class="status">Loading…</div></div>
  </div>

  <div id="view-lb" style="display:none">
    <div class="controls">
      <label>Window</label>
      <select id="lb-window" onchange="loadLeaderboard()">
        <option value="1d">Today</option>
        <option value="1w" selected>7 days</option>
        <option value="1m">30 days</option>
        <option value="all">All time</option>
      </select>
      <label>Rank by</label>
      <select id="lb-rank" onchange="loadLeaderboard()">
        <option value="pnl" selected>Profit</option>
        <option value="vol">Volume</option>
      </select>
    </div>
    <div id="lb-body" class="scroll"><div class="status">Loading…</div></div>
  </div>

  <div id="view-whale" style="display:none">
    <div class="controls">
      <label>Min trade size</label>
      <select id="whale-min" onchange="loadWhales()">
        <option value="1000">$1,000+</option>
        <option value="5000" selected>$5,000+</option>
        <option value="10000">$10,000+</option>
        <option value="25000">$25,000+</option>
      </select>
      <button id="whale-auto" onclick="toggleWhaleAuto()">Auto-refresh: off</button>
      <button onclick="loadWhales()">Refresh</button>
    </div>
    <div id="whale-body" class="scroll"><div class="status">Loading…</div></div>
  </div>

  <div id="view-paper" style="display:none">
    <div class="controls">
      <span class="live-dot"></span>
      <label>Simulated portfolio — auto-trades based on signal strength</label>
      <button onclick="loadPaper()">Refresh</button>
      <button onclick="triggerTradeRun()">Run engine</button>
      <button onclick="resetPaper()">Reset account</button>
    </div>
    <div id="paper-body" class="scroll"><div class="status">Loading…</div></div>
  </div>

  <div id="view-trader" style="display:none">
    <button class="back" onclick="backFromTrader()">&larr; Back</button>
    <div id="trader-body" class="scroll"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let currentTab = 'signals', prevTab = 'signals', whaleAutoTimer = null, watchlistTimer = null;

const fmtUsd = n => (n < 0 ? '-' : '') + '$' + Math.abs(n).toLocaleString(undefined, { maximumFractionDigits: 0 });
const fmtUsd2 = n => (n < 0 ? '-' : '') + '$' + Math.abs(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtCents = p => (p * 100).toFixed(1) + '¢';
const cls = n => n > 0 ? 'good' : n < 0 ? 'bad' : '';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const short = w => w ? w.slice(0, 6) + '…' + w.slice(-4) : '';
const displayName = u => {
  if (!u.userName || /^0x[0-9a-fA-F]{40}/.test(u.userName)) return short(u.proxyWallet);
  return u.userName;
};
const ago = ts => {
  const s = Math.max(0, Date.now() / 1000 - ts);
  if (s < 60) return Math.floor(s) + 's ago';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  return Math.floor(s / 86400) + 'd ago';
};

async function api(endpoint, params) {
  const q = new URLSearchParams({ endpoint, ...params }).toString();
  const r = await fetch(`/api/proxy?${q}`);
  if (!r.ok) throw new Error(`${endpoint}: HTTP ${r.status}`);
  return r.json();
}

/* ============ WATCHLIST (server-backed) ============ */
function getWatchlist() {
  return getWatchlistFromCache();
}
function saveWatchlist(wl) { stateAPI('watchlist', wl); }
function isWatching(wallet) { return !!getWatchlist()[wallet]; }

function toggleWatch(wallet, name, e) {
  if (e) e.stopPropagation();
  stateAPI('watchlist_toggle', { wallet, name });
  if (currentTab === 'watchlist') loadWatchlist();
  // Update all watch buttons on page
  document.querySelectorAll(`[data-wallet="${wallet}"]`).forEach(btn => {
    btn.classList.toggle('active', !!wl[wallet]);
    btn.textContent = wl[wallet] ? 'Watching' : '+ Watch';
  });
}

function watchBtnHtml(wallet, name) {
  const active = isWatching(wallet);
  return `<button class="watch-btn ${active ? 'active' : ''}" data-wallet="${esc(wallet)}" onclick="toggleWatch('${esc(wallet)}','${esc(name)}',event)">${active ? 'Watching' : '+ Watch'}</button>`;
}

function exportWatchlist() {
  const wl = getWatchlist();
  const blob = new Blob([JSON.stringify(wl, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'polymarket-watchlist.json';
  a.click();
}

function importWatchlist(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      const current = getWatchlist();
      Object.assign(current, data);
      saveWatchlist(current);
      loadWatchlist();
    } catch { alert('Invalid watchlist file'); }
  };
  reader.readAsText(file);
  e.target.value = '';
}

/* ============ TABS ============ */
const ALL_TABS = ['signals', 'watchlist', 'new', 'lb', 'whale', 'paper'];
function showTab(tab) {
  currentTab = tab;
  for (const t of ALL_TABS) {
    $('tab-' + t).classList.toggle('active', t === tab);
    $('view-' + t).style.display = t === tab ? '' : 'none';
  }
  $('view-trader').style.display = 'none';
  if (tab === 'signals') loadSignals();
  if (tab === 'watchlist') loadWatchlist();
  if (tab === 'new') loadNewWinners();
  if (tab === 'lb') loadLeaderboard();
  if (tab === 'whale') loadWhales();
  if (tab === 'paper') loadPaper();
}

/* ============ SIGNALS ENGINE ============ */
async function loadSignals() {
  const el = $('signals-body');
  el.innerHTML = '<div class="status">Scanning top 50 traders\' open positions for consensus and copyable entries…<br>This takes ~15 seconds.</div>';
  try {
    const lb = await api('leaderboard', { window: '1w', rankType: 'pnl', limit: 50 });
    const profitable = lb.filter(u => u.pnl > 0);

    // Fetch open positions for each top trader
    const traders = await Promise.all(profitable.map(async u => {
      try {
        const pos = await api('positions', { user: u.proxyWallet, limit: 200, sortBy: 'CURRENT', sortDirection: 'DESC' });
        const open = pos.filter(p => p.currentValue > 1);
        return { ...u, open, totalPositions: pos.length };
      } catch { return { ...u, open: [], totalPositions: null }; }
    }));

    // --- CONSENSUS: group positions by market+outcome ---
    const consensus = {};
    for (const t of traders) {
      for (const p of t.open) {
        const key = `${p.title}|||${p.outcome}`;
        if (!consensus[key]) consensus[key] = { title: p.title, outcome: p.outcome, slug: p.slug, traders: [], totalValue: 0 };
        consensus[key].traders.push({
          wallet: t.proxyWallet, name: displayName(t), rank: t.rank, pnl: t.pnl,
          value: p.currentValue, entry: p.avgPrice, now: p.curPrice, cashPnl: p.cashPnl
        });
        consensus[key].totalValue += p.currentValue;
      }
    }

    const consensusSignals = Object.values(consensus)
      .filter(c => c.traders.length >= 2)
      .sort((a, b) => b.traders.length - a.traders.length || b.totalValue - a.totalValue);

    // --- STILL COPYABLE: positions where current price is within 20% of entry ---
    const copyablePositions = [];
    for (const t of traders) {
      for (const p of t.open) {
        if (p.curPrice > 0 && p.avgPrice > 0 && p.currentValue > 100) {
          const gap = Math.abs(p.curPrice - p.avgPrice) / p.avgPrice;
          if (gap <= 0.20) {
            copyablePositions.push({
              ...p, traderName: displayName(t), traderWallet: t.proxyWallet,
              traderRank: t.rank, traderPnl: t.pnl, gap
            });
          }
        }
      }
    }
    copyablePositions.sort((a, b) => a.gap - b.gap);

    // --- FRESH WALLET LARGE BETS ---
    const freshWallets = traders
      .filter(t => t.totalPositions !== null && t.totalPositions < 30 && t.open.length > 0)
      .sort((a, b) => a.totalPositions - b.totalPositions);

    // --- SECTOR CONCENTRATION ---
    const sectors = {};
    for (const t of traders) {
      for (const p of t.open) {
        let sector = 'Other';
        const title = (p.title || '').toLowerCase();
        if (/bitcoin|btc|ethereum|eth|crypto|solana|sol|xrp/i.test(title)) sector = 'Crypto';
        else if (/trump|biden|president|senate|congress|governor|election|democrat|republican|political|party/i.test(title)) sector = 'Politics';
        else if (/fed|interest rate|inflation|gdp|recession|tariff|cpi/i.test(title)) sector = 'Macro/Fed';
        else if (/nba|nfl|mlb|nhl|soccer|football|tennis|ufc|mma|boxing|cricket|esport|lol|cs2|dota|league|counter-strike|game \d|winner/i.test(title)) sector = 'Sports/Esports';
        else if (/ai |openai|google|apple|meta |microsoft|tesla|stock|s&p|nasdaq/i.test(title)) sector = 'Tech/AI';
        sectors[sector] = (sectors[sector] || 0) + p.currentValue;
      }
    }
    const sectorList = Object.entries(sectors).sort((a, b) => b[1] - a[1]);
    const totalExposed = sectorList.reduce((a, [, v]) => a + v, 0);

    // --- RENDER ---
    let html = '';

    // Summary tiles
    html += '<div class="tiles">';
    html += `<div class="tile"><div class="k">Consensus plays</div><div class="v">${consensusSignals.length}</div><div class="muted">markets w/ 2+ top traders</div></div>`;
    html += `<div class="tile"><div class="k">Still copyable</div><div class="v">${copyablePositions.length}</div><div class="muted">within 20% of entry</div></div>`;
    html += `<div class="tile"><div class="k">Fresh wallets active</div><div class="v">${freshWallets.length}</div><div class="muted">&lt;30 lifetime positions</div></div>`;
    html += `<div class="tile"><div class="k">Smart money exposed</div><div class="v">${fmtUsd(totalExposed)}</div><div class="muted">across ${profitable.length} traders</div></div>`;
    html += '</div>';

    // Sector breakdown
    if (sectorList.length) {
      html += '<div class="section-header"><h2>Where smart money is concentrated</h2></div>';
      html += '<div style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px">';
      for (const [name, val] of sectorList) {
        const pct = totalExposed > 0 ? Math.round(val / totalExposed * 100) : 0;
        html += `<div class="tile" style="flex:1; min-width:120px"><div class="k">${esc(name)}</div><div class="v">${pct}%</div><div class="muted">${fmtUsd(val)}</div></div>`;
      }
      html += '</div>';
    }

    // Consensus signals
    html += `<div class="section-header"><h2>Consensus plays</h2><span class="section-count">${consensusSignals.length}</span></div>`;
    html += '<div class="muted" style="margin-bottom:10px">Markets where multiple top-50 profitable traders hold the same position. More traders = stronger signal.</div>';

    for (const c of consensusSignals.slice(0, 20)) {
      const strength = c.traders.length >= 4 ? 'high' : c.traders.length >= 3 ? 'med' : 'low';
      const avgEntry = c.traders.reduce((a, t) => a + t.entry, 0) / c.traders.length;
      const avgNow = c.traders.reduce((a, t) => a + t.now, 0) / c.traders.length;
      const gap = avgEntry > 0 ? Math.abs(avgNow - avgEntry) / avgEntry : 1;
      const stillCopyable = gap <= 0.20;

      html += `<div class="signal-card ${strength}">
        <div style="display:flex; justify-content:space-between; align-items:start; flex-wrap:wrap; gap:6px">
          <div>
            <span class="signal-strength ${strength}">${c.traders.length} traders agree</span>
            ${stillCopyable ? '<span class="copyable-tag yes">Still copyable</span>' : '<span class="copyable-tag late">Price moved</span>'}
            <div style="font-size:15px; font-weight:600; margin-top:4px">${esc(c.title)}</div>
            <div class="muted">Outcome: <strong style="color:var(--ink)">${esc(c.outcome)}</strong></div>
          </div>
          <div style="text-align:right">
            <div style="font-size:15px; font-weight:600">${fmtUsd(c.totalValue)} exposed</div>
            <div class="muted">Avg entry: ${fmtCents(avgEntry)} · Now: ${fmtCents(avgNow)}</div>
          </div>
        </div>
        <div class="trader-chips">

/* ============ WATCHLIST VIEW ============ */
async function loadWatchlist() {
  const el = $('watchlist-body');
  try { await getServerState(true); } catch {}
  const wl = getWatchlist();
  const wallets = Object.keys(wl);

  if (!wallets.length) {
    el.innerHTML = `<div class="status" style="padding:40px">
      <div style="font-size:16px; color:var(--ink); margin-bottom:8px">No insiders on your watchlist yet</div>
      <div>Go to <strong>New Winners</strong> or <strong>Leaderboard</strong> and click <strong>+ Watch</strong> on any trader to start tracking them.</div>
    </div>`;
    return;
  }

  if (!el.querySelector('.card')) el.innerHTML = '<div class="status">Loading watchlist…</div>';

  try {
    const results = await Promise.all(wallets.map(async wallet => {
      const info = wl[wallet];
      try {
        const [positions, trades] = await Promise.all([
          api('positions', { user: wallet, limit: 200, sortBy: 'CURRENT', sortDirection: 'DESC' }),
          api('trades', { user: wallet, limit: 50, takerOnly: 'true' }),
        ]);
        const open = positions.filter(p => p.currentValue > 1);
        const openValue = open.reduce((a, p) => a + p.currentValue, 0);
        const unrealized = open.reduce((a, p) => a + p.cashPnl, 0);

        // Detect new positions since last check
        const prevCount = info.lastPositionCount;
        const newPositions = prevCount !== null && open.length > prevCount ? open.length - prevCount : 0;
        wl[wallet].lastPositionCount = open.length;

        const recentTrades = trades.filter(t => (Date.now() / 1000 - t.timestamp) < 3600);

        return { wallet, name: info.name, open, openValue, unrealized, trades, recentTrades, newPositions, ok: true };
      } catch (e) { return { wallet, name: info.name, ok: false, error: e.message }; }
    }));

    saveWatchlist(wl);

    const alerts = results.filter(r => r.ok && (r.newPositions > 0 || r.recentTrades.length > 0));

    let html = '';

    if (alerts.length) {
      html += '<div class="alert"><strong>Activity detected:</strong> ';
      html += alerts.map(r => {
        const parts = [];
        if (r.newPositions > 0) parts.push(`${r.newPositions} new position(s)`);
        if (r.recentTrades.length > 0) parts.push(`${r.recentTrades.length} trade(s) in last hour`);
        return `<strong>${esc(r.name)}</strong> — ${parts.join(', ')}`;
      }).join(' · ');
      html += '</div>';
    }

    html += `<div class="muted" style="margin-bottom:10px">Tracking ${wallets.length} insider(s) · Last refreshed ${new Date().toLocaleTimeString()}</div>`;

    for (const r of results) {
      if (!r.ok) {
        html += `<div class="card"><div class="card-head"><span>${esc(r.name)}</span><span class="muted">Error: ${esc(r.error)}</span></div></div>`;
        continue;
      }
      const top3 = r.open.slice(0, 3);
      html += `<div class="card" onclick="openTrader('${esc(r.wallet)}','${esc(r.name)}')">
        <div class="card-head">
          <div>
            <span style="font-weight:600; font-size:15px">${esc(r.name)}</span>
            <span class="badge watching">Watching</span>
            ${r.recentTrades.length ? '<span class="badge hot">Active now</span>' : ''}
            <div class="muted">${short(r.wallet)}</div>
          </div>
          <div style="text-align:right">
            <div style="font-size:15px; font-weight:600">${r.open.length} open · ${fmtUsd(r.openValue)}</div>
            <div class="muted ${cls(r.unrealized)}">Unrealized: ${fmtUsd(r.unrealized)}</div>
          </div>
        </div>`;

      if (top3.length) {
        html += `<div style="margin-top:10px"><table style="min-width:auto"><thead><tr>
          <th>Market</th><th>Outcome</th><th class="num">Entry</th><th class="num">Now</th><th class="num">Value</th><th class="num">P&L</th>
        </tr></thead><tbody>` +
        top3.map(p => `<tr>
          <td style="max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap">${esc(p.title)}</td>
          <td>${esc(p.outcome)}</td>
          <td class="num">${fmtCents(p.avgPrice)}</td>
          <td class="num">${fmtCents(p.curPrice)}</td>
          <td class="num">${fmtUsd2(p.currentValue)}</td>
          <td class="num ${cls(p.cashPnl)}">${fmtUsd(p.cashPnl)}</td>
        </tr>`).join('') +
        (r.open.length > 3 ? `<tr><td colspan="6" class="muted">+ ${r.open.length - 3} more positions</td></tr>` : '') +
        '</tbody></table></div>';
      } else {
        html += '<div class="muted" style="margin-top:8px">No open positions right now</div>';
      }

      if (r.recentTrades.length) {
        html += `<div style="margin-top:8px; font-size:12px; color:var(--warn)">Recent trades: ` +
          r.recentTrades.slice(0, 3).map(t =>
            `<span class="pill ${t.side === 'BUY' ? 'buy' : 'sell'}">${t.side}</span> ${esc(t.title)} @ ${fmtCents(t.price)}`
          ).join(' · ') + '</div>';
      }

      html += '</div>';
    }

    el.innerHTML = html;
  } catch (e) { el.innerHTML = `<div class="status">Failed: ${esc(e.message)}</div>`; }
}

function backFromTrader() { showTab(prevTab); }

async function openTrader(wallet, name) {
  prevTab = currentTab;
  for (const t of ALL_TABS) $('view-' + t).style.display = 'none';
  $('view-trader').style.display = '';
  const el = $('trader-body');
  el.innerHTML = '<div class="status">Loading trader…</div>';
  try {
    const [positions, trades] = await Promise.all([
      api('positions', { user: wallet, limit: 100, sortBy: 'CURRENT', sortDirection: 'DESC' }),
      api('trades', { user: wallet, limit: 100, takerOnly: 'true' }),
    ]);

    const open = positions.filter(p => p.currentValue > 1);
    const openValue = open.reduce((a, p) => a + p.currentValue, 0);
    const unrealized = open.reduce((a, p) => a + p.cashPnl, 0);
    const realized = positions.reduce((a, p) => a + (p.realizedPnl || 0), 0);

    const wins = settled.filter(p => p.realizedPnl > 0).length;

    const buys = trades.filter(t => t.side === 'BUY');
    const buyShare = trades.length ? Math.round(buys.length / trades.length * 100) : 0;
    const avgSize = trades.length ? trades.reduce((a, t) => a + t.size * t.price, 0) / trades.length : 0;
    const avgEntry = buys.length ? buys.reduce((a, t) => a + t.price, 0) / buys.length : 0;
    const byMarket = {};
    for (const t of trades) byMarket[t.title] = (byMarket[t.title] || 0) + t.size * t.price;

        <div class="tile"><div class="k">Avg entry price</div><div class="v">${buys.length ? fmtCents(avgEntry) : '—'}</div><div class="muted">low = longshots, high = favorites</div></div>
      </div>

      <h2>Open positions</h2>
      ${open.length ? `<table><thead><tr>
          <th>Market</th><th>Outcome</th><th class="num">Entry</th><th class="num">Now</th><th class="num">Value</th><th class="num">P&amp;L</th>
        </tr></thead><tbody>` +

          <td>${esc(p.title)}</td><td>${esc(p.outcome)}</td>

/* ============ PAPER TRADING ENGINE v3 — SERVER-SIDE ============ */
const PAPER_STARTING_BALANCE = 10000;
const TAKE_PROFIT_PCT = 0.25;
const STOP_LOSS_PCT = -0.20;
const TRAILING_STOP_TRIGGER = 0.15;
const MAX_POSITIONS = 20;
const MAX_EXPOSURE_PCT = 0.60;

let paperAutoTimer = null;
let _stateCache = null;

async function getServerState(force) {
  if (_stateCache && !force) return _stateCache;
  const r = await fetch('/api/state');
  if (!r.ok) throw new Error('Failed to load state from server');
  _stateCache = await r.json();
  return _stateCache;
}

async function getPaper() {
  const state = await getServerState();
  return state.portfolio;
}

function getWatchlistFromCache() {
  return (_stateCache && _stateCache.watchlist) || {};
}

async function stateAPI(type, data) {
  const r = await fetch('/api/state', {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ type, data }),
  });
  _stateCache = null;
  return r.json();
}

async function resetPaper() {
  if (!confirm('Reset paper account to $10,000? All simulated trades will be erased.')) return;
  await stateAPI('reset', {});

}

async function toggleAutoTrade() { const p = await getPaper(); await stateAPI('settings', { autoTrade: !p.autoTrade }); loadPaper(); }
async function toggleMirrorWatchlist() { const p = await getPaper(); await stateAPI('settings', { mirrorWatchlist: !p.mirrorWatchlist }); loadPaper(); }
async function toggleAutoClose() { const p = await getPaper(); await stateAPI('settings', { autoClose: !p.autoClose }); loadPaper(); }

async function migrateToServer() {
  const paper = JSON.parse(localStorage.getItem('pm_paper') || 'null');
  const watchlist = JSON.parse(localStorage.getItem('pm_watchlist') || 'null');
  if (!paper && !watchlist) return;
  try {
    const r = await stateAPI('migrate', { portfolio: paper, watchlist: watchlist });
    if (r.migrated) {
      localStorage.setItem('pm_migrated', 'true');
      loadPaper();
    } else if (r.hasData) {
      if (confirm('Server already has data. Overwrite with local data?')) {
        await stateAPI('reset', {});
        await stateAPI('migrate', { portfolio: paper, watchlist: watchlist });
        localStorage.setItem('pm_migrated', 'true');
        loadPaper();
      }
    }
  } catch (e) {
    alert('Migration failed: ' + e.message);
  }
}

function getWeeklyRetro(paper) {
  const weekAgo = Date.now() - 7 * 86400000;
  const weekTrades = paper.closed.filter(t => t.closedAt >= weekAgo);
  if (!weekTrades.length) return null;

  const totalPnl = weekTrades.reduce((a, t) => a + t.pnl, 0);
  const wins = weekTrades.filter(t => t.pnl > 0);
  const losses = weekTrades.filter(t => t.pnl <= 0);
  const winRate = (wins.length / weekTrades.length * 100).toFixed(0);
  const best = weekTrades.reduce((a, t) => t.pnl > a.pnl ? t : a, weekTrades[0]);
  const worst = weekTrades.reduce((a, t) => t.pnl < a.pnl ? t : a, weekTrades[0]);

  const avgHoldMs = weekTrades.reduce((a, t) => a + ((t.closedAt || 0) - (t.openedAt || 0)), 0) / weekTrades.length;
  const avgHoldHrs = Math.round(avgHoldMs / 3600000);

  const byStrength = {};
  for (const t of weekTrades) {
    const lbl = t.strength || 'unknown';
    if (!byStrength[lbl]) byStrength[lbl] = { pnl: 0, count: 0, wins: 0 };
    byStrength[lbl].pnl += t.pnl;
    byStrength[lbl].count++;
    if (t.pnl > 0) byStrength[lbl].wins++;
  }

  const bySource = {};
  for (const t of weekTrades) {
    const src = t.source || 'consensus';
    if (!bySource[src]) bySource[src] = { pnl: 0, count: 0, wins: 0 };
    bySource[src].pnl += t.pnl;
    bySource[src].count++;
    if (t.pnl > 0) bySource[src].wins++;
  }

  const byReason = {};
  for (const t of weekTrades) {
    const r = t.closeReason || 'manual';
    byReason[r] = (byReason[r] || 0) + 1;
  }

  let maxDrawdown = 0, runningPnl = 0, peak = 0;
  const sorted = [...weekTrades].sort((a, b) => a.closedAt - b.closedAt);
  for (const t of sorted) {
    runningPnl += t.pnl;
    if (runningPnl > peak) peak = runningPnl;
    const dd = peak - runningPnl;
    if (dd > maxDrawdown) maxDrawdown = dd;
  }

  return {
    totalPnl, wins: wins.length, losses: losses.length, winRate,
    best, worst, byStrength, bySource, byReason,
    avgHoldHrs, maxDrawdown, total: weekTrades.length
  };
}

/* ---- News feed + sentiment ---- */
async function fetchNews(query) {
  try {
    const r = await fetch(`/api/news?q=${encodeURIComponent(query)}`);
    if (!r.ok) return [];
    const data = await r.json();
    return data.items || [];
  } catch { return []; }
}

function extractSearchTerms(title) {
  return title
    .replace(/Will |win |on |\?|O\/U \d+\.\d+|Spread:|vs\.|:/gi, '')
    .replace(/\d{4}-\d{2}-\d{2}/g, '')
    .replace(/\s+/g, ' ')
    .trim()
    .split(' ').filter(w => w.length > 2).slice(0, 4).join(' ');
}

const BULLISH_WORDS = /surge|rally|win|beat|lead|gain|rise|up|bullish|strong|positive|approve|pass|hike|increase|victory|ahead|favor/i;
const BEARISH_WORDS = /fall|drop|lose|crash|down|bearish|weak|negative|reject|fail|cut|decrease|defeat|behind|slump|decline/i;

function analyzeSentiment(headlines, outcome) {
  if (!headlines.length) return 'neutral';
  let score = 0;
  for (const h of headlines) {
    const t = h.title || '';
    if (BULLISH_WORDS.test(t)) score++;
    if (BEARISH_WORDS.test(t)) score--;
  }
  if (score >= 2) return 'bullish';
  if (score <= -2) return 'bearish';
  return 'neutral';
}

function newsAgo(pubDate) {
  if (!pubDate) return '';
  const s = Math.max(0, (Date.now() - new Date(pubDate).getTime()) / 1000);
  if (s < 3600) return Math.floor(s / 60) + 'm';
  if (s < 86400) return Math.floor(s / 3600) + 'h';
  return Math.floor(s / 86400) + 'd';
}

async function fetchNewsForPositions(positions) {
  const seen = new Set();
  const queries = [];
  for (const p of positions) {
    const q = extractSearchTerms(p.title);
    if (!q || seen.has(q)) continue;
    seen.add(q);
    queries.push({ key: p.key, query: q, title: p.title, outcome: p.outcome });
  }

  const results = {};
  const batches = queries.slice(0, 8);
  const fetched = await Promise.all(batches.map(async q => {
    const items = await fetchNews(q.query);
    return { ...q, items };
  }));

  for (const f of fetched) {
    results[f.key] = {
      items: f.items,
      sentiment: analyzeSentiment(f.items, f.outcome),
      query: f.query
    };
  }
  return results;
}

    }

      html += `<tr>
        <td class="muted" style="white-space:nowrap">${new Date(t.closedAt).toLocaleDateString()}</td>
        <td style="max-width:180px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap">${esc(t.title)}</td>
        <td>${esc(t.outcome)}</td>
        <td>${srcLabel}</td>
        <td><span class="muted">${reasonLabel}</span></td>
        <td class="num">${fmtCents(t.entry)}</td>
        <td class="num">${fmtCents(t.exitPrice)}</td>
        <td class="num ${cls(t.pnl)}">${fmtUsd2(t.pnl)}</td>
      </tr>`;
    }
    html += '</tbody></table>';
  } else {
    html += '<div class="status">No closed trades yet. Positions will auto-close at +25% (take profit) or -20% (stop loss).</div>';
  }

  html += `<div class="muted" style="margin-top:14px">Paper account started with ${fmtUsd(PAPER_STARTING_BALANCE)} · Created ${new Date(paper.created).toLocaleDateString()} · Server-side autonomous trading · All trades are simulated — no real money.</div>`;

  el.innerHTML = html;
}

function renderPositionTable(allPositions, sourceFilter) {
  let html = `<table><thead><tr>
    <th>Market</th><th>Outcome</th>`;
  if (sourceFilter === 'consensus') html += '<th>Signal</th>';
  if (sourceFilter === 'watchlist') html += '<th>From</th>';
  html += `<th class="num">Entry</th><th class="num">Now</th><th class="num">P&L %</th><th class="num">Cost</th><th class="num">Value</th><th class="num">P&L</th><th></th>
  </tr></thead><tbody>`;
  for (let i = 0; i < allPositions.length; i++) {
    const p = allPositions[i];
    if (p.source !== sourceFilter) continue;
    const cur = p.currentPrice || p.entry;
    const val = p.shares * cur;
    const pnl = val - p.cost;
    const pnlPct = p.cost > 0 ? (pnl / p.cost * 100).toFixed(1) : '0.0';
    const nearTP = pnl / p.cost >= TAKE_PROFIT_PCT * 0.8;
    const nearSL = pnl / p.cost <= STOP_LOSS_PCT * 0.8;
    html += `<tr${nearTP ? ' style="background:rgba(74,222,128,.05)"' : nearSL ? ' style="background:rgba(248,113,113,.05)"' : ''}>
      <td style="max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap">${esc(p.title)}</td>
      <td>${esc(p.outcome)}</td>`;
    if (sourceFilter === 'consensus') html += `<td><span class="signal-strength ${p.strength}">${p.traders} traders</span></td>`;
    if (sourceFilter === 'watchlist') html += `<td><span class="muted">${esc(p.sourceTrader || '?')}</span></td>`;
    html += `<td class="num">${fmtCents(p.entry)}</td>
      <td class="num">${fmtCents(cur)}</td>
      <td class="num ${cls(pnl)}" style="font-weight:600">${pnlPct}%</td>
      <td class="num">${fmtUsd2(p.cost)}</td>
      <td class="num">${fmtUsd2(val)}</td>
      <td class="num ${cls(pnl)}">${fmtUsd2(pnl)}</td>
      <td><button class="watch-btn" onclick="closePaperPosition(${i})">Close</button></td>
    </tr>`;
  }
  html += '</tbody></table>';
  return html;
}

// Pre-fetch server state so getWatchlist() works synchronously in other tabs
getServerState().catch(() => {});

// Auto-refresh watchlist every 60s
watchlistTimer = setInterval(() => { if (currentTab === 'watchlist') loadWatchlist(); }, 60000);
// Auto-refresh paper trading every 90s
paperAutoTimer = setInterval(() => { if (currentTab === 'paper') loadPaper(); }, 90000);
loadSignals();
